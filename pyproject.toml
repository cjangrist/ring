[project]
name = "f3-ring"
version = "0.1.0"
description = "macOS HID diagnostics and reproducible captures for the F3 Bluetooth ring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
f3-ring = "f3_ring.cli:main"

[project.urls]
Repository = "https://github.com/cjangrist/ring"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f3_ring"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs/reports",
  "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/uv.toml",
  "/.python-version", "/f3-ring", "/ring",
]
